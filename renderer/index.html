<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>摸鱼助手（face-api.js）</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h2>face-api.js / TinyFaceDetector</h2>

  <div id="videoWrap">
    <!-- 小尺寸视频 -->
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="controls">
    <label>检测间隔 (ms): <input id="interval" value="500" /></label>
    <label>人数阈值: <input id="peopleThreshold" value="1" /></label>
    <label>最小人脸高度比例 (%): <input id="minFaceRatio" value="8" /></label>
    <button id="startBtn">开始检测</button>
    <button id="stopBtn">停止检测</button>
    <div id="status">状态：未启动</div>

    <!-- 实时人数显示 -->
    <div id="peopleInfo">
      <span>检测到人数：</span><span id="peopleCount">0</span>
      <span style="margin-left:12px;color:#888;">(raw:</span><span id="rawCount" style="color:#888">0</span><span style="color:#888">)</span>
    </div>

    <!-- debug 日志（方便本地调试） -->
    <pre id="debugLog" style="max-height:160px; overflow:auto; background:#fff; border:1px solid #eee; padding:8px; margin-top:8px; font-size:12px;"></pre>
  </div>

  <!-- load TFJS + face-api.js from CDN (便于本地快速运行) -->
  <!-- face-api.js 0.22.2 只与 TensorFlow.js 1.x 兼容 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.4/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <script src="./renderer.js"></script>
</body>
</html>
